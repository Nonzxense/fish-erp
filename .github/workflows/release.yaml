name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Install Wails
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
          "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend deps
        shell: pwsh
        run: |
          if (Test-Path "frontend") {
            cd frontend
            npm ci
            cd ..
          }

      - name: Wails Doctor
        shell: pwsh
        run: |
          wails doctor

  build:
    needs: setup
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Install Wails
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
          "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build App
        shell: pwsh
        run: |
          .\build.bat

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: fish-release
          path: build/bin/*.exe

  release:
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download EXE
        uses: actions/download-artifact@v4
        with:
          name: fish-release
          path: build/bin

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content version.txt).Trim()
          echo "VERSION=$v" >> $env:GITHUB_OUTPUT

      - name: Check if tag exists
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.VERSION }}"
          git fetch --tags

          $exists = git tag -l $tag

          if ($exists -eq $tag) {
            Write-Error "Tag already exists"
          }

      - name: Create Tag
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.VERSION }}"

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git tag $tag
          git push origin $tag

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          files: build/bin/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
